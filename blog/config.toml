baseURL = "https://micsthepick.com/blog/"
locale = "en-us"
title = "micsthepick's blog"
theme = "PaperMod"
enableRobotsTXT = true
publishDir = "../docs"

[params]
    env = "production"
    author = "Michael Pannekoek"
    description = "Personal blog - powered by Hugo"
    defaultTheme = "auto"
    disableThemeToggle = false
    ShowReadingTime = true
    ShowBreadCrumbs = true
    ShowCodeCopyButtons = true
    ShowWordCount = true


[[params.socialIcons]]
    name = "github"
    url = "https://github.com/micsthepick/"

[[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/michael-pannekoek-007b63104/"

[[params.socialIcons]]
    name = "stackoverflow"
    url = "https://stackoverflow.com/users/4678667/micsthepick"

[[menu.main]]
    identifier = "home"
    name = "Home"
    url = "/"
    weight = 10

[[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 20

[[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "post/"
    weight = 30

